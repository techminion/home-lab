# Managed by home-lab (symlinked from repo dotfiles/tmux.conf).
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
# Prefix: Ctrl-a (easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Split panes with | and -
bind | split-window -h
bind - split-window -v
# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"
